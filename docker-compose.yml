services:
  api:
    build: .
    container_name: reto3-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/.chroma
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  chroma_data:
    driver: local
